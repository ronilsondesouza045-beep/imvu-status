name: release-apk

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publicar release com APK
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar credenciais do Google
        env:
          G_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          G_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$G_ID" ]; then
            printf 'GOOGLE_CLIENT_ID = "%s"\nGOOGLE_CLIENT_SECRET = "%s"\n' "$G_ID" "$G_SECRET" > google_creds.py
            echo "google_creds.py criado a partir dos secrets"
          else
            echo "sem secrets do Google; o login Google ficara desligado neste build"
          fi

      - name: Compilar APK (Docker oficial do Kivy)
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$PWD/ci":/home/user/.config \
            -v "$PWD/ci/.android":/home/user/.android \
            -v "$PWD/ci/.android":/root/.android \
            -e PIP_CONSTRAINT=/home/user/hostcwd/ci/pip-constraint.txt \
            kivy/buildozer:latest android debug

      - name: Criar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          NOTAS="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          if [ -z "$NOTAS" ]; then NOTAS="Versao $GITHUB_REF_NAME"; fi
          gh release create "$GITHUB_REF_NAME" bin/*.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTAS" \
            --verify-tag
