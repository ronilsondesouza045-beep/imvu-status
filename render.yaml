services:
  - type: web
    name: imvu-status
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: TZ
        value: America/Sao_Paulo
      - key: COLETOR_ATIVO
        value: "1"
      - key: POLL_WATCH
        value: "15"
      - key: POLL_AVATAR
        value: "120"
      - key: POLL_SALA
        value: "45"
      - key: SALAS_POR_CICLO
        value: "6"
      - key: DIRETORIO_MINUTOS
        value: "10"
      - key: MAX_WATCH_POR_DEVICE
        value: "10"
      - key: RETENCAO_SNAPSHOTS_DIAS
        value: "14"
      - key: RETENCAO_EVENTOS_DIAS
        value: "180"
      - key: RETENCAO_ALERTAS_DIAS
        value: "60"
      - key: ADMIN_TOKEN
        sync: false
      - key: IA_API_KEY
        sync: false
      - key: IA_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        sync: false
