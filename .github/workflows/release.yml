name: release-apk

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publicar release com APK
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Diagnostico keystore
        run: |
          echo "quem sou eu no container e onde os mounts aparecem:"
          docker run --rm \
            -v "$PWD/ci/.android":/home/user/.android \
            -v "$PWD/ci/.android":/root/.android \
            kivy/buildozer:latest bash -c "echo USER=$(whoami) ID=$(id -u); ls -la /home/user/.android/debug.keystore /root/.android/debug.keystore 2>&1"

      - name: Compilar APK (Docker oficial do Kivy)
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$PWD/ci":/home/user/.config \
            -v "$PWD/ci/.android":/home/user/.android \
            -v "$PWD/ci/.android":/root/.android \
            -e PIP_CONSTRAINT=/home/user/hostcwd/ci/pip-constraint.txt \
            kivy/buildozer:latest android debug

      - name: Criar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          NOTAS="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          if [ -z "$NOTAS" ]; then NOTAS="Versao $GITHUB_REF_NAME"; fi
          gh release create "$GITHUB_REF_NAME" bin/*.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTAS" \
            --verify-tag
